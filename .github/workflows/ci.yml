name: CI

on:
  push:
    branches: [refactor/next]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Better Auth exige un secreto en producción. En el CI nadie inicia sesión: este valor solo sirve para compilar.
          AUTH_SECRET: ci-solo-para-compilar-no-es-un-secreto-real-0000
